<!doctype html>
<html lang="ru">

<head>
    <!-- Кодировка документа; должна быть в первых 1024 байтах -->
    <meta charset="utf-8">
    <!-- Адаптивность: ширина viewport равна ширине устройства, масштаб 100% -->
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Первая страница — учебный сайт</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="./css/my.css">
</head>

<body>

    <!-- .container — центрированный блок с адаптивной максимальной шириной -->
    <div class="container">

        <!-- ШАПКА САЙТА (одинакова на всех страницах). Фон — картинка из папки images -->
        <header class="card card-header" style="background-image: url(./images/background.jpg);">
            <div class="card-body">
                <h5 class="card-title text-center">Live server<br>HTML CSS Support</h5>
            </div>
        </header>

        <div class="card">
            <!-- НАВИГАЦИЯ (одинакова на всех страницах).
                 Класс "active" и aria-current отмечают текущую страницу. -->
            <nav class="card-body">
                <ul class="nav nav-tabs">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="./index.html">Первая
                            страница</a></li>
                    <li class="nav-item"><a class="nav-link" href="./form.html">Форма</a></li>
                    <li class="nav-item"><a class="nav-link" href="./shop.html">Магазин</a></li>
                    <li class="nav-item"><a class="nav-link" href="./program.html">Я и моя образовательная программа</a></li>
                </ul>
            </nav>


            <!-- начало уникального содержания страницы -->
            <main class="card-body">
                <!-- id используется как якорь для ссылок «к началу страницы». -->
                <h5 class="card-title text-center" id="top_of_page">Первая страница</h5>

                <!-- Ссылки-якоря: href="#id" прокручивает страницу к элементу с этим id -->
                <a class="card-link" href="#section_1">На раздел 1</a>
                <a class="card-link" href="#section_2">На раздел 2</a>

                <!-- Раздел 1. Якорь id стоит прямо на заголовке (отдельная пустая ссылка не нужна) -->
                <h6 class="card-subtitle" id="section_1">Раздел 1</h6>
                <p class="card-text">Содержание раздела 1</p>
                <a class="card-link" href="#top_of_page">к началу страницы</a>

                <!-- Раздел 2 -->
                <h6 class="card-subtitle" id="section_2">Раздел 2</h6>
                <p class="card-text">Содержание раздела 2</p>
                <a class="card-link" href="#top_of_page">к началу страницы</a>
            </main>
            <!-- окончание уникального содержания страницы -->



            <!-- ПОДВАЛ САЙТА (одинаков на всех страницах) -->
            <footer class="card card-footer">
                <div class="card-body">
                    <p>Footer</p>
                </div>
            </footer>
        </div>

        <script crossorigin="anonymous"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="./js/program.js" defer></script>
</body>

</html>
