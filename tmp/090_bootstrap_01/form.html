<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Форма</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="./index.css">
</head>

<body>

    <div class="container">

        <!-- ШАПКА САЙТА -->
        <header class="card card-header" style="background-image: url(./images/background.jpg);">
            <div class="card-body">
                <h3 class="card-title text-center">Header</h3>
            </div>
        </header>

        <div class="card">
            <!-- НАВИГАЦИЯ: активная вкладка — «Форма» -->
            <nav class="card-body">
                <ul class="nav nav-tabs">
                    <li class="nav-item"><a class="nav-link" href="./index.html">Первая страница</a></li>
                    <li class="nav-item"><a class="nav-link" href="./shop.html">Магазин</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="./form.html">Форма</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="./program.html">Образовательная программа</a></li>
                </ul>
            </nav>

            <!-- начало уникального содержания страницы -->
            <main class="card-body">
                <h5 class="card-title text-center" id="top_of_page">Пример формы</h5>

                <!-- Учебная форма. Метод не указан, значит GET: значения полей попадают
                     в адресную строку (?q=search&var_01=01&...). Результат открывается
                     в новой вкладке (target="_blank") на поиске Bing.
                     Для просмотра того, что именно отправляется на сервер, можно временно
                     заменить action на https://httpbin.org/post и добавить method="post".
                     ВАЖНО: в реальных проектах пароли методом GET отправлять нельзя. -->
                <form action="https://www.bing.com/search" id="UserEnter" name="UserEnter" target="_blank">
                    <!-- Скрытое поле: поисковый запрос для Bing, пользователю не виден -->
                    <input type="hidden" name="q" value="search">

                    <!-- Простые текстовые поля. mb-3 — отступ снизу; form-label/form-control — стили Bootstrap.
                         Связь label→input задаётся парой for="..." / id="...".
                         Атрибут name — имя параметра при отправке; без него поле не передаётся. -->
                    <div class="mb-3">
                        <label for="formGroupExampleInput" class="form-label">Example label</label>
                        <input type="text" class="form-control" id="formGroupExampleInput"
                            placeholder="Example input placeholder" name="var_01" value="01">
                    </div>
                    <div class="mb-3">
                        <label for="formGroupExampleInput2" class="form-label">Another label</label>
                        <input type="text" class="form-control" id="formGroupExampleInput2"
                            placeholder="Another input placeholder" name="var_02" value="02">
                    </div>


                    <!-- Сетка Bootstrap: .row + .col-*. g-3 — промежутки между колонками.
                         col-md-6 — половина ширины на экранах от md, на узких — вся ширина. -->
                    <div class="row g-3">
                        <!-- Эти поля без атрибута name в запрос не попадают — они только для демонстрации внешнего вида. -->
                        <div class="col-md-6">
                            <label for="inputEmail4" class="form-label">Email</label>
                            <!-- type="email": браузер проверяет формат адреса -->
                            <input type="email" class="form-control" id="inputEmail4" autocomplete="email">
                        </div>
                        <div class="col-md-6">
                            <label for="inputPassword4" class="form-label">Password</label>
                            <!-- type="password": вводимые символы скрыты -->
                            <input type="password" class="form-control" id="inputPassword4"
                                autocomplete="current-password">
                        </div>
                        <div class="col-12">
                            <label for="inputAddress" class="form-label">Address</label>
                            <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main St">
                        </div>
                        <div class="col-12">
                            <label for="inputAddress2" class="form-label">Address 2</label>
                            <input type="text" class="form-control" id="inputAddress2"
                                placeholder="Apartment, studio, or floor">
                        </div>
                        <div class="col-md-6">
                            <label for="inputCity" class="form-label">City</label>
                            <input type="text" class="form-control" id="inputCity">
                        </div>
                        <div class="col-md-4">
                            <label for="inputState" class="form-label">State</label>
                            <!-- Выпадающий список; selected — пункт, выбранный по умолчанию -->
                            <select id="inputState" class="form-select">
                                <option selected>Choose...</option>
                                <option>...</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label for="inputZip" class="form-label">Zip</label>
                            <input type="text" class="form-control" id="inputZip">
                        </div>

                        <!-- Переключатели (radio): у обеих кнопок одинаковый name="radioDefault",
                             поэтому выбрать можно только одну из них. checked — выбрана по умолчанию. -->
                        <div class="col-2">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
                                <label class="form-check-label" for="radioDefault1">
                                    Default radio
                                </label>
                            </div>


                        </div>
                        <div class="col-2">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2"
                                    checked>
                                <label class="form-check-label" for="radioDefault2">
                                    Default checked radio
                                </label>
                            </div>
                        </div>


                        <!-- Флажок (checkbox): можно включить/выключить независимо от других -->
                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="gridCheck">
                                <label class="form-check-label" for="gridCheck">
                                    Check me out
                                </label>
                            </div>
                        </div>

                    </div>

                    <!-- Кнопка отправки формы. Отступ сверху (mt-3) отделяет её от сетки полей. -->
                    <div class="col-12 mt-3">
                        <button type="submit" class="btn btn-primary">Отправить</button>
                    </div>
                </form>
            </main>
            <!-- окончание уникального содержания страницы -->

            <!-- ПОДВАЛ САЙТА -->
            <footer class="card card-footer">
                <div class="card-body">
                    <p>Footer</p>
                </div>
            </footer>
        </div>


        <script crossorigin="anonymous"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
