<!doctype html>
<!-- lang="ru": страница на русском языке -->
<html lang="ru">

<head>
    <meta charset="utf-8">
    <!-- Адаптивность: ширина viewport равна ширине устройства -->
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Магазин</title>

    <!-- Bootstrap 5.3.3 (CSS). Раньше здесь была версия 5.2.3, отличавшаяся от остальных страниц;
         теперь версия единая. integrity — защита от подмены файла на CDN. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Собственные стили (подключаются после Bootstrap) -->
    <link rel="stylesheet" type="text/css" href="./index.css">
</head>

<body>

    <div class="container">

        <!-- ШАПКА САЙТА -->
        <header class="card card-header" style="background-image: url(./images/background.jpg);">
            <div class="card-body">
                <h3 class="card-title text-center">Header</h3>
            </div>
        </header>

        <div class="card">
            <!-- НАВИГАЦИЯ: активная вкладка — «Магазин» -->
            <div class="card-body">
                <ul class="nav nav-tabs">
                    <li class="nav-item"><a class="nav-link" href="./index.html">Первая страница</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="./shop.html">Магазин</a></li>
                    <li class="nav-item"><a class="nav-link" href="./form.html">Форма</a></li>
                </ul>
            </div>

            <!-- начало уникального содержания страницы -->
            <div class="card-body">
                <h5 class="card-title text-center">Магазин</h5>

                <!-- Учебная форма «корзины»: данные отправляются методом GET (по умолчанию)
                     на поиск Bing в новой вкладке (target="_blank"), чтобы можно было
                     увидеть, какие параметры уходят на сервер: q, vendor_code, amount.
                     Скрытое поле q задаёт поисковый запрос. -->
                <form action="https://www.bing.com/search" id="UserEnter" name="UserEnter" target="_blank">
                    <input name="q" type="hidden" value="search">

                    <!-- Контейнер для карточек товаров. Его содержимое создаётся скриптом
                         js/0650_api.js из файла data/shop.json (поиск по id="node_for_insert").
                         Классы Bootstrap: d-flex flex-row flex-wrap — карточки в ряд с переносом,
                         justify-content-around — равномерные промежутки, bg-light — светлый фон. -->
                    <ul class="d-flex flex-row flex-wrap justify-content-around bg-light" id="node_for_insert">
                        <!-- начало генерируемого фрагмента кода -->
                    </ul>

                    <!-- Кнопка отправки формы (type="submit" в нижнем регистре — стандартная запись) -->
                    <input class="btn btn-primary" type="submit" value="В корзину">
                </form>
            </div>
            <!-- окончание уникального содержания страницы -->
   
        <!-- ПОДВАЛ САЙТА -->
        <footer class="card card-footer">
            <div class="card-body">
                <p>Footer</p>
            </div>
        </footer>

    </div>

  
    <!-- Bootstrap JS (bundle с Popper), версия совпадает с CSS -->
    <script crossorigin="anonymous" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Скрипт магазина: загружает data/shop.json и строит карточки товаров.
         defer — выполнить после разбора HTML, не блокируя загрузку страницы. -->
    <script src="./js/0650_api.js" defer></script>
</body>

</html>
